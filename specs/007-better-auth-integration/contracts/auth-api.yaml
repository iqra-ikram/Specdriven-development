openapi: 3.0.0
info:
  title: Authentication Service API
  version: 1.0.0
  description: Key endpoints provided by the `better-auth` service.
servers:
  - url: http://localhost:4000
    description: Local Auth Service

paths:
  /api/auth/sign-up/email:
    post:
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '200':
          description: User created and logged in
          headers:
            Set-Cookie:
              schema:
                type: string
                description: Session cookie
        '400':
          description: Validation error or user exists

  /api/auth/sign-in/email:
    post:
      summary: Login with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Logged in successfully
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: Invalid credentials

  /api/auth/sign-out:
    post:
      summary: Sign out current user
      responses:
        '200':
          description: Session invalidated

  /api/auth/session:
    get:
      summary: Get current session
      responses:
        '200':
          description: Active session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                      userId:
                        type: string
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
        '401':
          description: No active session
